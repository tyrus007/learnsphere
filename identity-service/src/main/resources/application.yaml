server:
  port: 8081

spring:
  application:
    name: identity-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${POSTGRES_USER:learnsphere}
    password: ${POSTGRES_PASSWORD:learnsphere}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    # dialect is intentionally omitted — Spring Boot 3.x auto-detects
    # PostgreSQLDialect from the postgresql driver on the classpath

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:replace-this-in-production-with-a-256bit-base64-encoded-secret}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours default

management:
  endpoints:
    web:
      exposure:
        include: health,info
